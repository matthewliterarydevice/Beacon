<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Help is being contacted" />
    <meta property="twitter:card" content="summary_large_image" />
    <title>Help is being contacted</title>
    <link rel="stylesheet" href="../../styles/style.css" />
    <link rel="stylesheet" href="./help.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="help-page">
      <section class="help-content" aria-labelledby="help-title">
        <div class="help-logo-container">
          <img
            src="/public/images/green-logo.svg"
            alt="Help is being contacted logo"
            class="help-logo"
          />
        </div>

        <h1 id="help-title" class="help-title">Help is being contacted</h1>

        <div class="help-map-wrapper">
          <div class="help-response-counter" aria-live="polite">
            <span class="help-response-counter-label">People accepted</span>
            <div class="help-response-counter-value-row">
              <span id="helpResponseCounterValue" class="help-response-counter-value">0</span>
              <span class="help-response-counter-caption">responders</span>
            </div>
          </div>

          <div class="help-map-container"></div>
        </div>

        <div class="help-bottom">
          <a href="../emergency-page/emergency.html" class="help-cancel-button">Cancel</a>

          <p class="help-disclaimer">
            This app does not guarantee help will arrive.
          </p>
        </div>
      </section>
    </main>

    <script>
      (function () {
        const counterValue = document.getElementById('helpResponseCounterValue');
        if (!counterValue) return;

        const storedValue = Number(localStorage.getItem('beaconAcceptedResponsesCount') || '3');
        const targetValue = Number.isFinite(storedValue) && storedValue > 0 ? storedValue : 3;
        const duration = 900;
        const startTime = performance.now();

        function animateCounter(now) {
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          const currentValue = Math.round(targetValue * eased);
          counterValue.textContent = currentValue;

          if (progress < 1) {
            requestAnimationFrame(animateCounter);
          }
        }

        requestAnimationFrame(animateCounter);
      })();
    </script>
  </body>
</html>

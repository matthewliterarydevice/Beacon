<!DOCTYPE html>
<html lang="english">
  <head>
    <title>Nudge - exported project</title>
    <meta property="og:title" content="Nudge - exported project" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <meta property="twitter:card" content="summary_large_image" />

    </style>
    <style data-tag="default-style-sheet">
      html {
        font-family: Inter;
        font-size: 16px;
      }

      body {
        font-weight: 400;
        font-style:normal;
        text-decoration: none;
        text-transform: none;
        letter-spacing: normal;
        line-height: 1.15;
        color: var(--dl-color-theme-neutral-dark);
        background: var(--dl-color-theme-neutral-light);

        fill: var(--dl-color-theme-neutral-dark);
      }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/animate.css@4.1.1/animate.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap"
      data-tag="font"
    />
  </head>
  <body>
    <link rel="stylesheet" href="../../styles/style.css" />
    <div>
      <link href="./nudge.css" rel="stylesheet" />

      <div class="nudge-container1">
        <div class="nudge-thq-nudge-elm">
          <span class="nudge-thq-text-elm10 Header">Emergency Assistance</span>

          <!-- NEW: circle-stage wrapper. This box owns the flexible middle
               space and lets the circle size itself relative to it via
               container query units, so it can never collide with the
               card below or the header above. -->
          <div class="nudge-thq-circle-stage-elm">
            <button
              type="button"
              id="holdForHelpButton"
              class="nudge-thq-paragraphcontainer-elm"
              aria-label="Hold for help. Calls 911 and alerts nearby responders. Press and hold, or press and hold Enter."
            >
              <div id="holdForHelpProgress" class="nudge-hold-progress" aria-hidden="true"></div>
              <span class="nudge-thq-text-elm11 Header2">Hold for help</span>
              <span class="nudge-thq-text-elm12 Subtext">
                Call 911 + alert nearby responders
              </span>
            </button>
          </div>

          <div class="nudge-thq-frame27-elm">
            <div class="nudge-thq-frame29-elm" id="nudgeQuestionBlock">
              <span class="nudge-thq-text-elm13 Header2" id="nudgeQuestionText">
                Check the surroundings
              </span>
            </div>
            <div class="nudge-thq-frame32-elm" id="nudgeAnswerRow">
              <button id="yesButton" class="nudge-thq-frame30-elm">
                <span class="nudge-thq-text-elm14">Yes</span>
              </button>
              <button id="noButton" class="nudge-thq-frame31-elm">
                <span class="nudge-thq-text-elm15">No</span>
              </button>
            </div>
            <span class="nudge-thq-text-elm16" id="nudgeQuestionBlockInstructions">
              <span class="nudge-thq-text-elm17">To check:</span>
              <br />
              <span></span>
              <br />
              <span id="nudgeCheckInstructions">
                Look for anything nearby that might help: pills, bottles,
                needles, or signs of a fall.
              </span>
            </span>
            <div class="nudge-thq-frame33-elm" id="nudgeFooterRow">
              <span id="unsureButton" class="nudge-thq-text-elm20 Text">I'm unsure</span>
              <a href="../emergency-page/emergency.html" id="cancelButton" class="nudge-thq-text-elm21 Text">Cancel</a>
            </div>

          </div>
        </div>

      </div>
    </div>
    <script src="../../utils/hold-to-confirm.js"></script>
    <script src="./nudge.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        initHoldToConfirm({
          button: document.getElementById('holdForHelpButton'),
          progressLayer: document.getElementById('holdForHelpProgress'),
          labelElement: document.querySelector('.nudge-thq-text-elm11'),
          durationMs: 800,
          holdingLabel: 'Keep holding…',
          idleLabel: 'Hold for help',
          onConfirm: function () {
            window.location.href = '../help-page/help.html';
          },
        });
      });
    </script>
  </body>
</html>

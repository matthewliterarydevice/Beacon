    <title>Respond - exported project</title>
    <meta property="og:title" content="Respond - exported project" />

    <meta charset="utf-8" />
    <meta property="twitter:card" content="summary_large_image" />

    <style data-tag="default-style-sheet">
      html {
        font-family: Inter;
        font-size: 16px;
      }

      body {
        font-weight: 400;
        font-style:normal;
        text-decoration: none;
        text-transform: none;
        letter-spacing: normal;
        line-height: 1.15;
        color: var(--dl-color-theme-neutral-dark);
        background: var(--dl-color-theme-neutral-light);

        fill: var(--dl-color-theme-neutral-dark);
      }

    <link
      rel="stylesheet"
      href="https://unpkg.com/animate.css@4.1.1/animate.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap"
      data-tag="font"
    />
  </head>
  <body>
    <link rel="stylesheet" href="./style.css" />
    <div>
      <link href="./respond.css" rel="stylesheet" />

      <div class="respond-container1">
        <div class="respond-thq-respond-elm1">
          <div class="respond-thq-card-elm">
            <div class="respond-thq-top-section-elm">
              <div class="respond-thq-respond-elm2">
                <span class="respond-thq-text-elm10">Respond</span>
              </div>
              <div class="respond-thq-alerts-elm">
                <span class="respond-thq-text-elm11">Alerts on</span>
                <div class="respond-thq-toggle-elm">
                  <div class="respond-thq-togglewhitecircle-elm"></div>
                </div>
              </div>
            </div>
            <div class="respond-thq-bottom-section-elm">
              <div class="respond-thq-active-alert-elm">
                <span class="respond-thq-text-elm12">Active Alert</span>
                <span class="respond-thq-text-elm13">5 sec ago</span>
                <div class="respond-thq-body-elm">
                  <span class="respond-thq-text-elm14">
                    Suspected overdose nearby
                  </span>
                  <div class="respond-thq-frame11-elm">
                    <div class="respond-thq-frame10-elm">
                      <img
                        src="public/a-pin.png"
                        alt="a pin"
                        class="respond-thq-map-pin-elm"
                      />
                      <span class="respond-thq-text-elm15 Text">
                        <span>Carral St and Hastings</span>
                        <br />
                        <span>180m away (ETA 3m)</span>
                      </span>
                    </div>
                    <span class="respond-thq-text-elm18 Text">
                      3 other responders notified
                    </span>
                  </div>
                </div>
                <div class="respond-thq-buttons-elm">
                  <button id="acceptButton" class="respond-thq-frame20-elm">
                    <span class="respond-thq-text-elm19">Accept and go</span>
                  </button>
                  <button id="declineButton" class="respond-thq-frame21-elm">
                    <span class="respond-thq-text-elm20">Can’t respond</span>
                  </button>
                </div>
              </div>
              <div class="respond-thq-recentalerts-elm">
                <div class="respond-thq-line1-elm"></div>
                <div class="respond-thq-frame19-elm">
                  <span class="respond-thq-text-elm21 Text">Recent</span>
                  <div class="respond-thq-frame16-elm">
                    <div class="respond-thq-frame18-elm">
                      <div class="respond-thq-frame14-elm1">
                        <span class="respond-thq-text-elm22">
                          Gore Ave alert
                        </span>
                        <span class="respond-thq-text-elm23 Text">
                          Yesterday, 4:12 PM
                        </span>
                      </div>
                      <div class="respond-thq-status-elm1">
                        <span class="respond-thq-text-elm24 Text">
                          Responded
                        </span>
                      </div>
                    </div>
                    <div class="respond-thq-line2-elm"></div>
                    <div class="respond-thq-frame17-elm">
                      <div class="respond-thq-frame14-elm2">
                        <span class="respond-thq-text-elm25">
                          Hastings St alert
                        </span>
                        <span class="respond-thq-text-elm26 Text">
                          Yesterday, 1 AM
                        </span>
                      </div>
                      <div class="respond-thq-status-elm2">
                        <span class="respond-thq-text-elm27 Text">Missed</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
    <script>
      document.getElementById('acceptButton').addEventListener('click', function () {
        console.log('Accept and go pressed');
      });
      document.getElementById('declineButton').addEventListener('click', function () {
        console.log("Can't respond pressed");
      });
    </script>

    <a href="learn.html" class="bottom-nav-item" data-tab="learn">
      <span class="bottom-nav-label">Learn</span>

    <a href="emergency.html" class="bottom-nav-item" data-tab="emergency">
      <span class="bottom-nav-label">Emergency</span>
    </a>
    <a href="respond.html" class="bottom-nav-item bottom-nav-item-active" data-tab="respond">
      <span class="bottom-nav-label">Respond</span>
    </a>
  </nav>
  </body>
</html>

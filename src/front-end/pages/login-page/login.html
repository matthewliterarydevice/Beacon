<!DOCTYPE html>
<html lang="english">
  <head>
    <title>Log In - Beacon</title>
    <meta property="og:title" content="Log In - Beacon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <script src="./login.js"></script>
    <link rel="stylesheet" href="../../styles/style.css" />
    <link rel="stylesheet" href="./login.css" />

    <div class="login-container1">
      <div class="login-thq-signup-elm">
        <div class="login-thq-joinasaresponder-elm">
          <div class="login-thq-container-header-elm">
            <span class="login-thq-text-elm1">Welcome back</span>
          </div>
          <div class="login-thq-form-elm">
            <span class="login-thq-text-elm2">
              Sign in with the username and password you already received when your account was created.
            </span>
            <div class="login-thq-input-elm">
              <div class="login-thq-invitecode-elm1">
                <span class="login-thq-text-elm5 Text">Email or username</span>
                <input type="text" placeholder="Enter email or username" class="login-thq-textinput-elm1" />
              </div>
              <div class="login-thq-invitecode-elm2">
                <span class="login-thq-text-elm6 Text">Password</span>
                <input type="password" placeholder="Enter password" class="login-thq-textinput-elm2" />
              </div>
            </div>
            <button type="button" class="thq-button-filled login-thq-button-elm2">
              <span class="login-thq-text-elm8">Log in</span>
            </button>
            <p class="login-link-row">
              <span>Need an account?</span>
              <a href="../signup-page/signup.html" class="login-link">Sign up</a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="../learn-page/learn.html" class="bottom-nav-item" data-tab="learn">
        <span class="bottom-nav-label">Learn</span>
      </a>
      <a href="../emergency-page/emergency.html" class="bottom-nav-item" data-tab="emergency">
        <span class="bottom-nav-label">Emergency</span>
      </a>
      <a href="../respond-page/respond.html" class="bottom-nav-item bottom-nav-item-active" data-tab="respond">
        <span class="bottom-nav-label">Respond</span>
      </a>
    </nav>
  </body>
</html>
